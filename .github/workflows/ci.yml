name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v4

      - run: uv venv

      - name: Install CI dependencies
        run: uv pip install -e ".[analysis,dev]"

      - name: Lint
        run: PYTHONPATH=backend .venv/bin/ruff check backend tests scripts

      - name: Test
        run: PYTHONPATH=backend .venv/bin/pytest -q
        env:
          PYTHONPATH: backend
