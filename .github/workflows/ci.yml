name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v4

      - run: uv venv

      - run: uv pip install -e ".[dev,analysis]"

      - run: uv run pytest
        env:
          PYTHONPATH: backend
