services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: repomind
      POSTGRES_USER: repomind
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U repomind -d repomind"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ..
      dockerfile: Dockerfile.backend
    environment:
      REPOMIND_ENV: production
      REPOMIND_REQUIRE_API_KEY: "true"
      REPOMIND_API_KEY: ${REPOMIND_API_KEY:?set REPOMIND_API_KEY}
      REPOMIND_DATABASE_URL: postgresql+psycopg://repomind:${POSTGRES_PASSWORD}@postgres:5432/repomind
      REPOMIND_FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:-http://localhost:3000}
      REPOMIND_DATA_DIR: /data
      REPOMIND_REPORTS_DIR: /reports
      REPOMIND_REDIS_URL: redis://redis:6379/0
      REPOMIND_ENABLE_LOCAL_PATH_IMPORT: "false"
      REPOMIND_TRUST_REMOTE_MODEL_CODE: "false"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - repomind_data:/data
      - repomind_reports:/reports
    ports:
      - "8000:8000"

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    environment:
      NEXT_PUBLIC_API_BASE_URL: ${API_BASE_URL:-http://localhost:8000}
      NEXT_PUBLIC_REPOMIND_API_KEY: ${REPOMIND_API_KEY:?set REPOMIND_API_KEY}
    depends_on:
      - backend
    ports:
      - "3000:3000"

volumes:
  postgres_data:
  redis_data:
  repomind_data:
  repomind_reports:
