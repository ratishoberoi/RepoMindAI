app = "repomind-ai"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile.backend"

[env]
  REPOMIND_ENV = "production"
  REPOMIND_REQUIRE_API_KEY = "true"
  REPOMIND_ENABLE_LOCAL_PATH_IMPORT = "false"
  REPOMIND_TRUST_REMOTE_MODEL_CODE = "false"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    interval = "15s"
    timeout = "5s"
    grace_period = "20s"
    method = "GET"
    path = "/health"
