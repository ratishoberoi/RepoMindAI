[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile.backend"

[deploy]
restartPolicyType = "ON_FAILURE"
startCommand = "python -m repomind.worker"

[env]
REPOMIND_ENV = "production"
REPOMIND_REQUIRE_API_KEY = "true"
REPOMIND_ANALYSIS_QUEUE_BACKEND = "rq"
REPOMIND_ENABLE_LOCAL_PATH_IMPORT = "false"
REPOMIND_TRUST_REMOTE_MODEL_CODE = "false"
REPOMIND_DATA_DIR = "/data"
REPOMIND_REPORTS_DIR = "/data/reports"
REPOMIND_INDEX_DIR = "/data/indexes"
REPOMIND_CHROMA_DIR = "/data/chroma"
REPOMIND_UPLOAD_DIR = "/data/uploads"
REPOMIND_ENABLE_MODEL_INFERENCE = "false"
