services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    env_file: .env.example
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
      - ./reports:/app/reports
      - ${REPOMIND_MODEL_HOST_DIR:-./models/qwen-judge}:/app/models/qwen-judge:ro

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    environment:
      NEXT_PUBLIC_API_BASE: http://localhost:8000
    ports:
      - "3000:3000"
    depends_on:
      - backend
