services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    env_file: .env.example
    environment:
      REPOMIND_ENV: production
      REPOMIND_DATABASE_URL: postgresql+psycopg://repomind:repomind@postgres:5432/repomind
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
      - ./reports:/app/reports
      - ${REPOMIND_MODEL_HOST_DIR:-./models/qwen-judge}:/app/models/qwen-judge:ro
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    environment:
      NEXT_PUBLIC_API_BASE: http://localhost:8000
      NEXT_PUBLIC_REPOMIND_API_KEY: ${REPOMIND_API_KEY:-change-this-local-api-key}
    ports:
      - "3000:3000"
    depends_on:
      - backend

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: repomind
      POSTGRES_PASSWORD: repomind
      POSTGRES_DB: repomind
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U repomind -d repomind"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
