services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    env_file: .env.example
    environment:
      REPOMIND_ENV: production
      REPOMIND_DATABASE_URL: postgresql+psycopg://repomind:repomind@postgres:5432/repomind
      REPOMIND_REDIS_URL: redis://redis:6379/0
      REPOMIND_ANALYSIS_QUEUE_BACKEND: rq
      REPOMIND_AUTH_SECRET: ${REPOMIND_AUTH_SECRET:-change-this-32-character-session-secret}
      REPOMIND_SECRET_KEY: ${REPOMIND_SECRET_KEY:-change-this-32-character-encryption-secret}
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
      - ./reports:/app/reports
      - ${REPOMIND_MODEL_HOST_DIR:-./models/qwen-judge}:/app/models/qwen-judge:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build:
      context: .
      dockerfile: Dockerfile.backend
    env_file: .env.example
    command: ["python", "-m", "repomind.worker"]
    environment:
      REPOMIND_ENV: production
      REPOMIND_DATABASE_URL: postgresql+psycopg://repomind:repomind@postgres:5432/repomind
      REPOMIND_REDIS_URL: redis://redis:6379/0
      REPOMIND_ANALYSIS_QUEUE_BACKEND: rq
      REPOMIND_AUTH_SECRET: ${REPOMIND_AUTH_SECRET:-change-this-32-character-session-secret}
      REPOMIND_SECRET_KEY: ${REPOMIND_SECRET_KEY:-change-this-32-character-encryption-secret}
    volumes:
      - ./data:/app/data
      - ./reports:/app/reports
      - ${REPOMIND_MODEL_HOST_DIR:-./models/qwen-judge}:/app/models/qwen-judge:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    environment:
      NEXT_PUBLIC_API_BASE: http://localhost:8000
      NEXT_PUBLIC_REPOMIND_API_KEY: ${REPOMIND_API_KEY:-change-this-local-api-key}
    ports:
      - "3000:3000"
    depends_on:
      - backend

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: repomind
      POSTGRES_PASSWORD: repomind
      POSTGRES_DB: repomind
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U repomind -d repomind"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  prometheus:
    image: prom/prometheus:v2.54.1
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
    volumes:
      - ./deploy/observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "9090:9090"
    depends_on:
      - backend

  grafana:
    image: grafana/grafana:11.1.4
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-repomind-admin}
    volumes:
      - grafana-data:/var/lib/grafana
      - ./deploy/observability/grafana/provisioning:/etc/grafana/provisioning:ro
    ports:
      - "3001:3000"
    depends_on:
      - prometheus

volumes:
  postgres-data:
  redis-data:
  prometheus-data:
  grafana-data:
